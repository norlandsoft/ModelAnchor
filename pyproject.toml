[project]
name = "modelanchor"
version = "0.3.1"
description = "为 DrawThings 下载与维护模型的本地 Web 服务"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py310"
